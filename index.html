<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Buscador Farmacogenético de Opioides</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --navy: #082a5e;
      --navy2: #0b3d7a;
      --teal: #008c95;
      --teal2: #00a7a7;
      --card: rgba(255, 255, 255, 0.95);
      --border: #d7e4ea;
      --text: #10233f;
      --muted: #6b7a90;
      --green-bg: #e8f8ef;
      --green-border: #52b788;
      --green-text: #0d6b3f;
      --yellow-bg: #fff8df;
      --yellow-border: #e3b341;
      --yellow-text: #7a5500;
      --red-bg: #fdecec;
      --red-border: #e07171;
      --red-text: #9b1c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;

      background-image:
        linear-gradient(
          rgba(244, 249, 251, 0.86),
          rgba(244, 249, 251, 0.86)
        ),
        url("opiodes2.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      margin: 0;
      color: var(--text);
    }

    .container {
      max-width: 1120px;
      margin: 28px auto;
      padding: 0 22px 30px;
    }

    .title {
      background: linear-gradient(
        135deg,
        var(--navy),
        var(--navy2)
      );

      color: white;
      font-weight: bold;
      font-size: 28px;

      padding: 26px 34px;
      border-radius: 0 0 22px 22px;
      margin-bottom: 26px;

      box-shadow: 0 12px 28px rgba(8, 42, 94, 0.25);
      letter-spacing: 0.3px;
    }

    .title::after {
      content: "Apoyo a la decisión clínica personalizada";
      display: block;
      font-size: 16px;
      font-weight: normal;
      margin-top: 8px;
      color: #dcecff;
    }

    .section-title {
      font-weight: bold;
      font-size: 21px;
      color: var(--teal);
      margin: 28px 0 18px;
    }

    .section-title::before {
      content: "●";
      color: var(--teal2);
      margin-right: 10px;
    }

    .grid,
    .grid-2 {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 26px rgba(30, 70, 100, 0.10);
      backdrop-filter: blur(4px);
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      color: var(--navy);
      font-size: 14px;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 13px 14px;

      border: 1.5px solid #cfdbe4;
      border-radius: 10px;

      background: #ffffff;
      font-size: 15px;
      color: var(--text);
      outline: none;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0, 140, 149, 0.12);
    }

    textarea {
      min-height: 86px;
      resize: vertical;
    }

    .upload-box {
      border: 1px dashed var(--teal);
      border-radius: 18px;
      background: rgba(242, 251, 251, 0.95);
      padding: 24px;
      text-align: center;
      margin-bottom: 22px;
      box-shadow: 0 8px 26px rgba(30, 70, 100, 0.10);
    }

    button {
      display: block;
      margin: 22px auto;
      padding: 14px 28px;

      background: linear-gradient(
        135deg,
        var(--teal),
        var(--navy)
      );

      color: white;
      border: none;
      border-radius: 10px;

      font-weight: bold;
      font-size: 17px;
      cursor: pointer;

      box-shadow: 0 8px 18px rgba(8, 42, 94, 0.22);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    .result {
      margin-top: 26px;
      padding: 22px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: rgba(255, 255, 255, 0.96);
      display: none;
      line-height: 1.5;

      box-shadow: 0 8px 26px rgba(30, 70, 100, 0.10);
    }

    .report-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin: 16px 0;
      box-shadow: 0 6px 18px rgba(30, 70, 100, 0.06);
    }

    .report-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 12px;
      color: var(--navy);
    }

    .badge-green,
    .badge-yellow,
    .badge-red {
      padding: 10px 12px;
      border-radius: 10px;
      margin: 8px 0;
      font-weight: bold;
      display: block;
    }

    .badge-green {
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      color: var(--green-text);
    }

    .badge-yellow {
      background: var(--yellow-bg);
      border: 1px solid var(--yellow-border);
      color: var(--yellow-text);
    }

    .badge-red {
      background: var(--red-bg);
      border: 1px solid var(--red-border);
      color: var(--red-text);
    }

    .gene-table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-top: 14px;
    }

    .gene-table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
    }

    .gene-table th,
    .gene-table td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    .gene-table th {
      background: #eef7f8;
      color: var(--navy);
    }

    details {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fbfdfe;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      color: var(--navy);
    }

    .annotation {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .annotation:first-child {
      border-top: none;
    }

    .annotation-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .progress {
      background: #edf3f6;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
      height: 18px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(
        90deg,
        var(--teal),
        var(--navy)
      );
      transition: width 0.25s ease;
    }

    .small {
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 800px) {
      .grid,
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .title {
        font-size: 22px;
        padding: 22px;
      }

      .container {
        padding: 0 12px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="title">
      BUSCADOR FARMACOGENÉTICO DE OPIOIDES
    </div>

    <div class="section-title">
      INFORMACIÓN CLÍNICA DEL PACIENTE
    </div>

    <div class="grid">

      <div>
        <label for="edad">Edad</label>
        <input
          id="edad"
          type="number"
          min="0"
          placeholder="Ej. 65"
        >
      </div>

      <div>
        <label for="peso">Peso kg</label>
        <input
          id="peso"
          type="number"
          min="0"
          step="0.1"
          placeholder="Ej. 70"
        >
      </div>

      <div>
        <label for="sexo">Sexo</label>
        <select id="sexo">
          <option value="">Seleccione</option>
          <option value="Femenino">Femenino</option>
          <option value="Masculino">Masculino</option>
          <option value="Otro / No especificado">
            Otro / No especificado
          </option>
        </select>
      </div>

    </div>

    <div class="grid-2">

      <div>
        <label for="diagnostico">
          Diagnóstico o indicación clínica
        </label>

        <textarea
          id="diagnostico"
          placeholder="Ej. dolor oncológico, dolor postoperatorio, dolor crónico..."
        ></textarea>
      </div>

      <div>
        <label for="medicamentos">
          Medicamentos concomitantes
        </label>

        <textarea
          id="medicamentos"
          placeholder="Ej. antidepresivos, benzodiacepinas, anticonvulsivantes, inhibidores CYP..."
        ></textarea>
      </div>

    </div>

    <div class="grid">

      <div>
        <label for="renal">Función renal</label>

        <select id="renal">
          <option value="">Seleccione</option>
          <option value="Normal / TFG > 90">
            Normal / TFG &gt; 90
          </option>
          <option value="Leve / TFG 60-89">
            Leve / TFG 60-89
          </option>
          <option value="Moderada / TFG 30-59">
            Moderada / TFG 30-59
          </option>
          <option value="Severa / TFG 15-29">
            Severa / TFG 15-29
          </option>
          <option value="Falla renal / TFG < 15">
            Falla renal / TFG &lt; 15
          </option>
          <option value="Desconocida">
            Desconocida
          </option>
        </select>
      </div>

      <div>
        <label for="hepatica">
          Función hepática
        </label>

        <select id="hepatica">
          <option value="">Seleccione</option>
          <option value="Normal">Normal</option>
          <option value="Alteración leve">
            Alteración leve
          </option>
          <option value="Alteración moderada">
            Alteración moderada
          </option>
          <option value="Alteración severa">
            Alteración severa
          </option>
          <option value="Desconocida">
            Desconocida
          </option>
        </select>
      </div>

      <div>
        <label for="dolor">
          Tipo de dolor
        </label>

        <select id="dolor">
          <option value="">Seleccione</option>
          <option value="Agudo">Agudo</option>
          <option value="Crónico">Crónico</option>
          <option value="Oncológico">Oncológico</option>
          <option value="Postoperatorio">Postoperatorio</option>
          <option value="Paliativo">Paliativo</option>
        </select>
      </div>

    </div>

    <div class="grid-2">

      <div>
        <label for="actual">
          Opioide actual
        </label>

        <select id="actual">
          <option value="">Seleccione</option>
          <option value="Ninguno">Ninguno</option>
          <option value="Codeína">Codeína</option>
          <option value="Tramadol">Tramadol</option>
          <option value="Hidrocodona">Hidrocodona</option>
          <option value="Oxicodona">Oxicodona</option>
          <option value="Morfina">Morfina</option>
          <option value="Hidromorfona">Hidromorfona</option>
          <option value="Fentanilo">Fentanilo</option>
          <option value="Metadona">Metadona</option>
          <option value="Buprenorfina">Buprenorfina</option>
          <option value="Tapentadol">Tapentadol</option>
        </select>
      </div>

      <div>
        <label for="adversos">
          Eventos adversos previos a opioides
        </label>

        <textarea
          id="adversos"
          placeholder="Ej. náuseas, sedación, depresión respiratoria, falta de analgesia..."
        ></textarea>
      </div>

    </div>

    <div class="section-title">
      CARGA DE REPORTE FARMACOGENÉTICO
    </div>

    <div class="upload-box">

      <p>
        Suba un reporte farmacogenético en PDF.
        El sistema buscará todos los genes reconocidos
        y sus resultados cercanos dentro del documento.
      </p>

      <input
        type="file"
        id="pdf"
        accept=".pdf,application/pdf"
      >

      <button
        id="botonPDF"
        type="button"
        onclick="leerPDF()"
      >
        Leer PDF farmacogenético
      </button>

    </div>

    <div class="section-title">
      INFORME CONSOLIDADO DE TODOS LOS GENES
    </div>

    <div class="grid-2">

      <div>
        <label for="farmaco">
          Opioide a evaluar
        </label>

        <select id="farmaco">
          <option value="">Seleccione</option>
          <option value="Codeína">Codeína</option>
          <option value="Tramadol">Tramadol</option>
          <option value="Hidrocodona">Hidrocodona</option>
          <option value="Oxicodona">Oxicodona</option>
          <option value="Morfina">Morfina</option>
          <option value="Hidromorfona">Hidromorfona</option>
          <option value="Fentanilo">Fentanilo</option>
          <option value="Metadona">Metadona</option>
          <option value="Buprenorfina">Buprenorfina</option>
          <option value="Tapentadol">Tapentadol</option>
        </select>
      </div>

      <div>
        <label for="modoInforme">
          Nivel de detalle
        </label>

        <select id="modoInforme">
          <option value="completo">
            Mostrar todas las anotaciones
          </option>

          <option value="resumido">
            Mostrar resumen por gen
          </option>
        </select>
      </div>

    </div>

    <button
      id="botonConsultar"
      type="button"
      onclick="generarInformeTodosLosGenes()"
    >
      Generar informe completo de todos los genes
    </button>

    <div
      id="resultado"
      class="result"
      aria-live="polite"
    ></div>

  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let genesDetectadosPDF = [];
    let resultadosGenesPDF = {};
    let textoCompletoPDF = "";

    /*
      Lista inicial de genes farmacogenéticos.
      Puede ampliarse posteriormente.
    */
    const genesFarmacogeneticos = [
      "ABCB1",
      "ABCC1",
      "ABCC2",
      "ABCC3",
      "ABCG2",
      "ANKK1",
      "BDNF",
      "CES1",
      "COMT",
      "CYP1A2",
      "CYP2A6",
      "CYP2B6",
      "CYP2C8",
      "CYP2C9",
      "CYP2C19",
      "CYP2D6",
      "CYP2E1",
      "CYP3A4",
      "CYP3A5",
      "CYP3A7",
      "DRD2",
      "FAAH",
      "GABRA2",
      "GABRB2",
      "GABRG2",
      "GRIK1",
      "GRIN1",
      "GRIN2A",
      "GRIN2B",
      "HTR1A",
      "HTR2A",
      "HTR2C",
      "KCNJ6",
      "MC1R",
      "MTHFR",
      "NR3C1",
      "OPRD1",
      "OPRK1",
      "OPRL1",
      "OPRM1",
      "P2RX7",
      "PDYN",
      "POMC",
      "SCN9A",
      "SLC6A4",
      "SULT1A1",
      "UGT1A1",
      "UGT1A3",
      "UGT1A4",
      "UGT1A6",
      "UGT1A9",
      "UGT2B4",
      "UGT2B7",
      "UGT2B15",
      "UGT2B17"
    ];

    async function leerPDF() {
      const archivo =
        document.getElementById("pdf").files[0];

      const boton =
        document.getElementById("botonPDF");

      if (!archivo) {
        mostrarHTML(`
          <div class="badge-yellow">
            Debe seleccionar un archivo PDF.
          </div>
        `);

        return;
      }

      const esPDF =
        archivo.type === "application/pdf" ||
        archivo.name.toLowerCase().endsWith(".pdf");

      if (!esPDF) {
        mostrarHTML(`
          <div class="badge-yellow">
            El archivo seleccionado debe estar en formato PDF.
          </div>
        `);

        return;
      }

      boton.disabled = true;
      boton.textContent = "Leyendo PDF...";

      mostrarHTML(`
        <div class="report-card">
          <div class="report-title">
            Procesando reporte farmacogenético
          </div>

          <p>
            El sistema está leyendo todas las páginas
            y buscando genes farmacogenéticos.
          </p>
        </div>
      `);

      try {
        const buffer =
          await archivo.arrayBuffer();

        const pdf =
          await pdfjsLib
            .getDocument({ data: buffer })
            .promise;

        let texto = "";

        for (
          let numeroPagina = 1;
          numeroPagina <= pdf.numPages;
          numeroPagina++
        ) {
          const pagina =
            await pdf.getPage(numeroPagina);

          const contenido =
            await pagina.getTextContent();

          const textoPagina =
            contenido.items
              .map(item => item.str)
              .join(" ");

          texto += ` ${textoPagina}`;
        }

        if (!texto.trim()) {
          mostrarHTML(`
            <div class="badge-yellow">
              No fue posible extraer texto del PDF.
              El documento podría estar escaneado como imagen.
            </div>

            <p class="small">
              Esta versión no utiliza OCR.
            </p>
          `);

          return;
        }

        textoCompletoPDF = texto;

        analizarTextoPDF(texto);

      } catch (error) {
        mostrarHTML(`
          <div class="badge-red">
            No fue posible procesar el archivo PDF.
          </div>

          <p class="small">
            ${escaparHTML(error.message)}
          </p>
        `);

      } finally {
        boton.disabled = false;
        boton.textContent =
          "Leer PDF farmacogenético";
      }
    }

    function analizarTextoPDF(textoOriginal) {
      const textoNormalizado =
        normalizarTexto(textoOriginal);

      genesDetectadosPDF =
        detectarGenes(textoNormalizado);

      resultadosGenesPDF = {};

      genesDetectadosPDF.forEach(gen => {
        resultadosGenesPDF[gen] =
          extraerResultadoPorGen(
            textoNormalizado,
            gen
          );
      });

      mostrarResumenGenesDetectados();
    }

    function detectarGenes(textoNormalizado) {
      const encontrados =
        genesFarmacogeneticos.filter(gen => {
          const expresion =
            new RegExp(
              `(^|[^A-Z0-9])${escaparRegex(gen)}([^A-Z0-9]|$)`,
              "i"
            );

          return expresion.test(textoNormalizado);
        });

      return [...new Set(encontrados)]
        .sort((a, b) => a.localeCompare(b));
    }

    function extraerResultadoPorGen(
      textoNormalizado,
      gen
    ) {
      const posiciones = [];

      let inicioBusqueda = 0;

      while (inicioBusqueda < textoNormalizado.length) {
        const posicion =
          textoNormalizado.indexOf(
            gen,
            inicioBusqueda
          );

        if (posicion === -1) {
          break;
        }

        posiciones.push(posicion);
        inicioBusqueda =
          posicion + gen.length;
      }

      if (!posiciones.length) {
        return {
          fenotipo: "No identificado",
          alelos: [],
          fragmento: ""
        };
      }

      const ventanas =
        posiciones.map(posicion => {
          const inicio =
            Math.max(0, posicion - 350);

          const final =
            Math.min(
              textoNormalizado.length,
              posicion + gen.length + 650
            );

          return textoNormalizado.slice(
            inicio,
            final
          );
        });

      let mejorFenotipo =
        "No identificado";

      let mejorFragmento =
        ventanas[0] || "";

      for (const ventana of ventanas) {
        const fenotipo =
          detectarFenotipoEnTexto(ventana);

        if (fenotipo !== "No identificado") {
          mejorFenotipo = fenotipo;
          mejorFragmento = ventana;
          break;
        }
      }

      const alelos =
        detectarAlelosEnVentanas(
          ventanas,
          gen
        );

      return {
        fenotipo: mejorFenotipo,
        alelos,
        fragmento: mejorFragmento
      };
    }

    function detectarFenotipoEnTexto(texto) {
      const reglas = [
        {
          expresiones: [
            "ULTRARAPID METABOLIZER",
            "ULTRA RAPID METABOLIZER",
            "ULTRARAPID METABOLISER",
            "METABOLIZADOR ULTRARRAPIDO",
            "METABOLIZADOR ULTRA RAPIDO"
          ],
          valor: "Metabolizador ultrarrápido"
        },
        {
          expresiones: [
            "POOR METABOLIZER",
            "POOR METABOLISER",
            "METABOLIZADOR LENTO"
          ],
          valor: "Metabolizador lento"
        },
        {
          expresiones: [
            "INTERMEDIATE METABOLIZER",
            "INTERMEDIATE METABOLISER",
            "METABOLIZADOR INTERMEDIO"
          ],
          valor: "Metabolizador intermedio"
        },
        {
          expresiones: [
            "NORMAL METABOLIZER",
            "NORMAL METABOLISER",
            "EXTENSIVE METABOLIZER",
            "METABOLIZADOR NORMAL"
          ],
          valor: "Metabolizador normal"
        },
        {
          expresiones: [
            "RAPID METABOLIZER",
            "RAPID METABOLISER",
            "METABOLIZADOR RAPIDO"
          ],
          valor: "Metabolizador rápido"
        },
        {
          expresiones: [
            "INCREASED ACTIVITY",
            "INCREASED FUNCTION",
            "ACTIVIDAD AUMENTADA",
            "FUNCION AUMENTADA"
          ],
          valor: "Actividad aumentada"
        },
        {
          expresiones: [
            "DECREASED ACTIVITY",
            "DECREASED FUNCTION",
            "REDUCED ACTIVITY",
            "REDUCED FUNCTION",
            "ACTIVIDAD REDUCIDA",
            "FUNCION REDUCIDA"
          ],
          valor: "Actividad reducida"
        },
        {
          expresiones: [
            "NO FUNCTION",
            "NULL FUNCTION",
            "NO ACTIVITY",
            "SIN FUNCION",
            "SIN ACTIVIDAD"
          ],
          valor: "Sin actividad funcional"
        },
        {
          expresiones: [
            "NORMAL ACTIVITY",
            "NORMAL FUNCTION",
            "ACTIVIDAD NORMAL",
            "FUNCION NORMAL"
          ],
          valor: "Actividad normal"
        }
      ];

      for (const regla of reglas) {
        const encontrado =
          regla.expresiones.some(
            expresion =>
              texto.includes(expresion)
          );

        if (encontrado) {
          return regla.valor;
        }
      }

      return "No identificado";
    }

    function detectarAlelosEnVentanas(
      ventanas,
      gen
    ) {
      const encontrados = [];

      ventanas.forEach(ventana => {
        const patrones = [
          /\*[0-9]+[A-Z]?(?:X[0-9N]+)?/g,
          /\bRS[0-9]+\b/g,
          /\bC\.[0-9]+[A-Z]?>[A-Z]\b/g,
          /\b[A-Z]\/[A-Z]\b/g
        ];

        patrones.forEach(patron => {
          const coincidencias =
            ventana.match(patron) || [];

          coincidencias.forEach(valor => {
            encontrados.push(valor);
          });
        });
      });

      return [...new Set(encontrados)]
        .slice(0, 20);
    }

    async function generarInformeTodosLosGenes() {

      boton.disabled = true;

        "Consultando todos los genes...";

      mostrarHTML(`
        <div class="report-card">
          <div class="report-title">
            Consultando ClinPGx
          </div>

          <p>
            Se consultarán
            <strong>${genesDetectadosPDF.length}</strong>

        </div>
      `);

        const consultas = [];

        for (
          let indice = 0;
          indice < genesDetectadosPDF.length;
          indice++
        ) {
          const gen =
            genesDetectadosPDF[indice];

          actualizarProgreso(
            indice,

          );

              await consultarClinPGx(

            consultas.push({

          } catch (error) {

              estado: "error",

        actualizarProgreso(
          genesDetectadosPDF.length,
          genesDetectadosPDF.length,

        );

        mostrarInformeConsolidado(

    function actualizarProgreso(
      procesados,
      total,
      gen
    ) {
      const barra =
        document.getElementById("barraProgreso");

      const texto =
        document.getElementById("textoProgreso");

      if (!barra || !texto) {
        return;
      }

      const porcentaje =
        total > 0
          ? Math.round(
              (procesados / total) * 100
            )
          : 0;

      barra.style.width =
        `${porcentaje}%`;

      texto.textContent =
        procesados >= total
          ? "Consultas completadas."
          : `Consultando ${gen}: ${procesados + 1} de ${total}`;
    }

    async function consultarClinPGx(
      farmacoVisible,
      gen
    ) {
      const farmacoAPI =
        convertirFarmacoParaAPI(
          farmacoVisible
        );

      const parametros =
        new URLSearchParams({
          drug: farmacoAPI,
          gene: gen
        });

      const respuesta =
        await fetch(
          `/api/clinpgx?${parametros.toString()}`
        );

      let contenido;

      try {
        contenido =
          await respuesta.json();

      } catch {
        throw new Error(
          "La API devolvió un formato no válido."
        );
      }

      if (!respuesta.ok) {
        throw new Error(
          contenido.error ||
          contenido.detail ||
          `Error HTTP ${respuesta.status}`
        );
      }

      return contenido;
    }

    function generarDetalleGen(

        modo === "resumido"

              `Anotación ${indice + 1}`;

    function extraerRegistrosClinPGx(
      contenido
    ) {
      if (!contenido) {
        return [];
      }

      if (Array.isArray(contenido)) {
        return contenido;
      }

      if (
        Array.isArray(contenido.data)
      ) {
        return contenido.data;
      }

      if (
        contenido.data &&
        Array.isArray(contenido.data.data)
      ) {
        return contenido.data.data;
      }

      if (
        Array.isArray(contenido.results)
      ) {
        return contenido.results;
      }

      return [];
    }

    function obtenerTextoObjeto(objeto) {
      try {
        return JSON.stringify(
          objeto,
          null,
          2
        );
      } catch {
        return "Anotación recuperada sin descripción textual.";
      }
    }

    function convertirFarmacoParaAPI(
      farmaco
    ) {
      const equivalencias = {
        "Codeína": "codeine",
        "Tramadol": "tramadol",
        "Hidrocodona": "hydrocodone",
        "Oxicodona": "oxycodone",
        "Morfina": "morphine",
        "Hidromorfona": "hydromorphone",
        "Fentanilo": "fentanyl",
        "Metadona": "methadone",
        "Buprenorfina": "buprenorphine",
        "Tapentadol": "tapentadol"
      };

      return equivalencias[farmaco] ||
        farmaco;
    }

    function generarAdvertenciaFinal() {
      return `
        <div class="report-card">
          <div class="report-title">
            Advertencia
          </div>

          <p class="small">
            Esta herramienta es un prototipo de apoyo a
            la decisión clínica. La detección automática
            de genes, alelos y fenotipos puede contener
            errores y debe verificarse contra el informe
            farmacogenético original. La información de
            ClinPGx no reemplaza el criterio médico, la
            historia clínica, la revisión farmacológica,
            la confirmación del genotipo o las guías
            profesionales vigentes. No debe utilizarse
            como sistema autónomo de prescripción.
          </p>
        </div>
      `;
    }

    function normalizarTexto(valor) {
      return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function escaparRegex(valor) {
      return String(valor)
        .replace(
          /[.*+?^${}()|[\]\\]/g,
          "\\$&"
        );
    }

    function escaparHTML(valor) {
      return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function mostrarHTML(html) {
      const resultado =
        document.getElementById("resultado");

      resultado.style.display =
        "block";

      resultado.innerHTML =
        html;

      resultado.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }
  </script>

</body>
</html>
