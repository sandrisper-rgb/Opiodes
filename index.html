<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador Farmacogenético de Opioides</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

 <style>
  :root {
    --navy: #082a5e;
    --navy2: #0b3d7a;
    --teal: #008c95;
    --teal2: #00a7a7;
    --soft: #eef8fb;
    --card: #ffffff;
    --border: #d7e4ea;
    --text: #10233f;
    --muted: #6b7a90;
  }

  body {
    font-family: Arial, sans-serif;
    background:
      radial-gradient(circle at top left, #d7f3f6 0, transparent 35%),
      radial-gradient(circle at bottom right, #cce9ff 0, transparent 35%),
      #f4f9fb;
    margin: 0;
    padding: 0;
    color: var(--text);
  }

  .container {
    max-width: 1120px;
    margin: 28px auto;
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0 22px 30px;
  }

  .title {
    background: linear-gradient(135deg, var(--navy), var(--navy2));
    color: white;
    text-align: left;
    font-weight: bold;
    font-size: 28px;
    padding: 26px 34px;
    border-radius: 0 0 22px 22px;
    margin: 0 0 26px;
    box-shadow: 0 12px 28px rgba(8, 42, 94, 0.25);
    letter-spacing: 0.3px;
  }

  .title::after {
    content: "Apoyo a la decisión clínica personalizada";
    display: block;
    font-size: 16px;
    font-weight: normal;
    margin-top: 8px;
    color: #dcecff;
  }

  .section-title {
    text-align: left;
    font-weight: bold;
    font-size: 21px;
    color: var(--teal);
    border-bottom: none;
    padding-bottom: 0;
    margin: 28px 0 18px;
  }

  .section-title::before {
    content: "●";
    color: var(--teal2);
    margin-right: 10px;
  }

  .grid, .grid-2 {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 8px 26px rgba(30, 70, 100, 0.08);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 18px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 18px;
  }

  label {
    font-weight: bold;
    display: block;
    margin-bottom: 8px;
    color: var(--navy);
    font-size: 14px;
  }

  select, input, textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid #cfdbe4;
    border-radius: 10px;
    background: #ffffff;
    font-size: 15px;
    box-sizing: border-box;
    color: var(--text);
    outline: none;
  }

  select:focus, input:focus, textarea:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(0, 140, 149, 0.12);
  }

  textarea {
    min-height: 86px;
    resize: vertical;
  }

  .upload-box {
    border: 1px dashed var(--teal);
    border-radius: 18px;
    background: linear-gradient(135deg, #f2fbfb, #ffffff);
    padding: 24px;
    text-align: center;
    font-weight: bold;
    margin-bottom: 22px;
    box-shadow: 0 8px 26px rgba(30, 70, 100, 0.08);
  }

  button {
    display: block;
    margin: 22px auto;
    padding: 14px 28px;
    background: linear-gradient(135deg, var(--teal), var(--navy));
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(8, 42, 94, 0.22);
  }

  button:hover {
    transform: translateY(-1px);
    opacity: 0.95;
  }

  .result {
    margin-top: 26px;
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: #ffffff;
    display: none;
    line-height: 1.5;
    box-shadow: 0 8px 26px rgba(30, 70, 100, 0.08);
  }

  .report-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin: 16px 0;
    box-shadow: 0 6px 18px rgba(30, 70, 100, 0.06);
  }

  .report-title {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 12px;
    color: var(--navy);
  }

  .badge-green, .badge-yellow, .badge-red {
    padding: 10px 12px;
    border-radius: 10px;
    margin: 8px 0;
    font-weight: bold;
    display: block;
  }

  .badge-green {
    background: #e8f8ef;
    border: 1px solid #52b788;
    color: #0d6b3f;
  }

  .badge-yellow {
    background: #fff8df;
    border: 1px solid #e3b341;
    color: #7a5500;
  }

  .badge-red {
    background: #fdecec;
    border: 1px solid #e07171;
    color: #9b1c1c;
  }

  .small {
    font-size: 13px;
    color: var(--muted);
  }

  @media (max-width: 800px) {
    .grid, .grid-2 {
      grid-template-columns: 1fr;
    }

    .title {
      font-size: 22px;
      padding: 22px;
    }
  }
</style>
</head>

<body>
  <div class="container">
    <div class="title">BUSCADOR FARMACOGENÉTICO DE OPIOIDES</div>

    <div class="section-title">INFORMACIÓN CLÍNICA DEL PACIENTE</div>

    <div class="grid">
      <div><label for="edad">Edad</label><input id="edad" type="number" placeholder="Ej. 65"></div>
      <div><label for="peso">Peso kg</label><input id="peso" type="number" placeholder="Ej. 70"></div>
      <div>
        <label for="sexo">Sexo</label>
        <select id="sexo">
          <option value="">Seleccione</option>
          <option>Femenino</option>
          <option>Masculino</option>
          <option>Otro / No especificado</option>
        </select>
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label for="diagnostico">Diagnóstico o indicación clínica</label>
        <textarea id="diagnostico" placeholder="Ej. dolor oncológico, dolor postoperatorio, dolor crónico..."></textarea>
      </div>
      <div>
        <label for="medicamentos">Medicamentos concomitantes</label>
        <textarea id="medicamentos" placeholder="Ej. antidepresivos, benzodiacepinas, anticonvulsivantes, inhibidores CYP..."></textarea>
      </div>
    </div>

    <div class="grid">
      <div>
        <label for="renal">Función renal</label>
        <select id="renal">
          <option value="">Seleccione</option>
          <option>Normal / TFG > 90</option>
          <option>Leve / TFG 60-89</option>
          <option>Moderada / TFG 30-59</option>
          <option>Severa / TFG 15-29</option>
          <option>Falla renal / TFG < 15</option>
          <option>Desconocida</option>
        </select>
      </div>

      <div>
        <label for="hepatica">Función hepática</label>
        <select id="hepatica">
          <option value="">Seleccione</option>
          <option>Normal</option>
          <option>Alteración leve</option>
          <option>Alteración moderada</option>
          <option>Alteración severa</option>
          <option>Desconocida</option>
        </select>
      </div>

      <div>
        <label for="dolor">Tipo de dolor</label>
        <select id="dolor">
          <option value="">Seleccione</option>
          <option>Agudo</option>
          <option>Crónico</option>
          <option>Oncológico</option>
          <option>Postoperatorio</option>
          <option>Paliativo</option>
        </select>
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label for="actual">Opioide actual</label>
        <select id="actual">
          <option value="">Seleccione</option>
          <option>Ninguno</option>
          <option>Codeína</option>
          <option>Tramadol</option>
          <option>Hidrocodona</option>
          <option>Oxicodona</option>
          <option>Morfina</option>
          <option>Hidromorfona</option>
          <option>Fentanilo</option>
          <option>Metadona</option>
          <option>Buprenorfina</option>
          <option>Tapentadol</option>
        </select>
      </div>

      <div>
        <label for="adversos">Eventos adversos previos a opioides</label>
        <textarea id="adversos" placeholder="Ej. náuseas, sedación, depresión respiratoria, falta de analgesia..."></textarea>
      </div>
    </div>

    <div class="section-title">CARGA DE REPORTE FARMACOGENÉTICO</div>

    <div class="upload-box">
      <p>Suba un reporte farmacogenético en PDF. El sistema intentará extraer genes y fenotipos relevantes para opioides.</p>
      <input type="file" id="pdf" accept=".pdf">
      <button onclick="leerPDF()">Leer PDF farmacogenético</button>
    </div>

    <div class="section-title">SELECCIÓN MANUAL FARMACOGENÉTICA</div>

    <div class="grid">
      <div>
        <label for="farmaco">Opioide a evaluar</label>
        <select id="farmaco">
          <option value="">Seleccione</option>
          <option>Codeína</option>
          <option>Tramadol</option>
          <option>Hidrocodona</option>
          <option>Oxicodona</option>
          <option>Morfina</option>
          <option>Hidromorfona</option>
          <option>Fentanilo</option>
          <option>Metadona</option>
          <option>Buprenorfina</option>
          <option>Tapentadol</option>
        </select>
      </div>

      <div>
        <label for="gen">Gen</label>
        <select id="gen">
          <option value="">Seleccione</option>
          <option>CYP2D6</option>
          <option>CYP2B6</option>
          <option>OPRM1</option>
          <option>CYP3A4</option>
          <option>CYP3A5</option>
          <option>COMT</option>
          <option>ABCB1</option>
        </select>
      </div>

      <div>
        <label for="fenotipo">Fenotipo</label>
        <select id="fenotipo">
          <option value="">Seleccione</option>
          <option>Metabolizador lento</option>
          <option>Metabolizador Intermedio</option>
          <option>Metabolizador Normal</option>
          <option>Metabolizador Rápido</option>
          <option>Metabolizador Ultrarápido</option>
          <option>Desconocido</option>
        </select>
      </div>
    </div>

    <button onclick="consultar()">Generar reporte clínico preliminar</button>

    <div id="resultado" class="result"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    async function leerPDF() {
      const archivo = document.getElementById("pdf").files[0];

      if (!archivo) {
        mostrarHTML("<div class='badge-yellow'>Debe seleccionar un archivo PDF.</div>");
        return;
      }

      const buffer = await archivo.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

      let textoPDF = "";

      for (let i = 1; i <= pdf.numPages; i++) {
        const pagina = await pdf.getPage(i);
        const contenido = await pagina.getTextContent();
        textoPDF += " " + contenido.items.map(item => item.str).join(" ");
      }

      analizarTextoPDF(textoPDF);
    }

    function analizarTextoPDF(texto) {
      const t = texto.toUpperCase();

      let fenotipoCYP2D6 = "Unknown";

      if (t.includes("CYP2D6") && t.includes("POOR METABOLIZER")) fenotipoCYP2D6 = "Poor Metabolizer";
      if (t.includes("CYP2D6") && t.includes("INTERMEDIATE METABOLIZER")) fenotipoCYP2D6 = "Intermediate Metabolizer";
      if (t.includes("CYP2D6") && t.includes("NORMAL METABOLIZER")) fenotipoCYP2D6 = "Normal Metabolizer";
      if (t.includes("CYP2D6") && t.includes("RAPID METABOLIZER")) fenotipoCYP2D6 = "Rapid Metabolizer";
      if (t.includes("CYP2D6") && t.includes("ULTRARAPID METABOLIZER")) fenotipoCYP2D6 = "Ultrarapid Metabolizer";

      mostrarHTML(generarReporte(fenotipoCYP2D6, true));
    }

    function consultar() {
      const fenotipo = document.getElementById("fenotipo").value || "Unknown";
      mostrarHTML(generarReporte(fenotipo, false));
    }

    function generarReporte(fenotipoCYP2D6, desdePDF) {
      let recomendados = ["Morfina", "Hidromorfona"];
      let precaucion = ["Hidrocodona", "Oxicodona"];
      let evitar = [];

      if (fenotipoCYP2D6 === "Poor Metabolizer" || fenotipoCYP2D6 === "Ultrarapid Metabolizer") {
        evitar = ["Codeína", "Tramadol"];
      } else if (fenotipoCYP2D6 === "Intermediate Metabolizer") {
        precaucion.unshift("Codeína", "Tramadol");
      } else {
        precaucion.push("Codeína", "Tramadol");
      }

      let html = "";

      html += `
        <div class="report-card">
          <div class="report-title">1. Resumen ejecutivo para apoyo a la decisión clínica</div>
          <span class="badge-green">Opioides preferidos o con menor dependencia de CYP2D6: ${recomendados.join(", ")}</span>
          <span class="badge-yellow">Usar con precaución: ${precaucion.join(", ")}</span>
          <span class="badge-red">Considerar evitar: ${evitar.length ? evitar.join(", ") : "No definido en esta evaluación preliminar"}</span>
        </div>
      `;

      html += `
        <div class="report-card">
          <div class="report-title">2. Perfil farmacogenético relevante</div>
          <strong>Fuente:</strong> ${desdePDF ? "PDF farmacogenético cargado" : "Selección manual"}<br>
          <strong>Gen principal:</strong> CYP2D6<br>
          <strong>Fenotipo detectado/seleccionado:</strong> ${fenotipoCYP2D6}<br>
          <strong>Implicación clínica:</strong> CYP2D6 puede modificar la activación de codeína y tramadol, y puede influir parcialmente en la respuesta a hidrocodona y oxicodona.
        </div>
      `;

      html += resumenPaciente();

      html += `
        <div class="report-card">
          <div class="report-title">4. Acción clínica sugerida</div>
          ${accionClinica(fenotipoCYP2D6)}
        </div>
      `;

      html += `
        <div class="report-card">
          <div class="report-title">5. Evidencia y fuentes clínicas</div>
          Interpretación preliminar basada en reglas locales derivadas de principios farmacogenéticos usados por CPIC, PharmGKB, DPWG y ClinPGx. La próxima versión conectará bases de datos externas para recuperar recomendaciones actualizadas.
        </div>
      `;

      html += `
        <div class="report-card">
          <div class="report-title">6. Advertencia</div>
          <p class="small">
          Esta herramienta es un prototipo de apoyo a la decisión clínica. No reemplaza el criterio médico, la revisión farmacológica integral, la historia clínica ni las guías clínicas completas. Toda recomendación debe ser validada por un profesional de salud.
          </p>
        </div>
      `;

      return html;
    }

    function resumenPaciente() {
      const edad = document.getElementById("edad").value || "No registrada";
      const peso = document.getElementById("peso").value || "No registrado";
      const sexo = document.getElementById("sexo").value || "No registrado";
      const diagnostico = document.getElementById("diagnostico").value || "No registrado";
      const renal = document.getElementById("renal").value || "No registrada";
      const hepatica = document.getElementById("hepatica").value || "No registrada";
      const dolor = document.getElementById("dolor").value || "No registrado";
      const actual = document.getElementById("actual").value || "No registrado";
      const medicamentos = document.getElementById("medicamentos").value || "No registrados";
      const adversos = document.getElementById("adversos").value || "No registrados";

      let alertas = "";

      if (Number(edad) > 65) alertas += "<span class='badge-yellow'>Paciente mayor de 65 años: considerar riesgo aumentado de sedación, caídas y eventos adversos.</span>";
      if (renal.includes("Moderada") || renal.includes("Severa") || renal.includes("Falla")) alertas += "<span class='badge-yellow'>Función renal alterada: considerar ajuste, vigilancia o selección cuidadosa del opioide.</span>";
      if (hepatica.includes("moderada") || hepatica.includes("severa") || hepatica.includes("Alteración moderada") || hepatica.includes("Alteración severa")) alertas += "<span class='badge-yellow'>Función hepática alterada: considerar metabolismo del opioide y vigilancia clínica.</span>";
      if (medicamentos !== "No registrados") alertas += "<span class='badge-yellow'>Medicamentos concomitantes: revisar depresores del sistema nervioso central e inhibidores/inductores CYP.</span>";
      if (adversos !== "No registrados") alertas += "<span class='badge-yellow'>Eventos adversos previos: considerar historia de tolerabilidad antes de seleccionar opioide.</span>";

      return `
        <div class="report-card">
          <div class="report-title">3. Factores clínicos del paciente</div>
          <strong>Edad:</strong> ${edad}<br>
          <strong>Peso:</strong> ${peso} kg<br>
          <strong>Sexo:</strong> ${sexo}<br>
          <strong>Diagnóstico:</strong> ${diagnostico}<br>
          <strong>Tipo de dolor:</strong> ${dolor}<br>
          <strong>Función renal:</strong> ${renal}<br>
          <strong>Función hepática:</strong> ${hepatica}<br>
          <strong>Opioide actual:</strong> ${actual}<br>
          <strong>Medicamentos concomitantes:</strong> ${medicamentos}<br>
          <strong>Eventos adversos previos:</strong> ${adversos}<br><br>
          ${alertas || "<span class='badge-green'>No se generaron alertas clínicas adicionales con los datos ingresados.</span>"}
        </div>
      `;
    }

    function accionClinica(fenotipo) {
      if (fenotipo === "Poor Metabolizer") {
        return "Evitar codeína y tramadol por posible falta de eficacia analgésica. Considerar morfina o hidromorfona, integrando función renal, función hepática, edad, comorbilidades e interacciones.";
      }
      if (fenotipo === "Intermediate Metabolizer") {
        return "Usar codeína y tramadol con precaución por posible respuesta analgésica reducida. Considerar alternativa como morfina o hidromorfona si hay dolor moderado-severo, respuesta insuficiente o factores clínicos de riesgo.";
      }
      if (fenotipo === "Ultrarapid Metabolizer") {
        return "Considerar evitar codeína y tramadol por riesgo aumentado de toxicidad relacionada con conversión rápida a metabolitos activos.";
      }
      return "No se identificó una alerta farmacogenética fuerte para CYP2D6 en esta versión preliminar. Mantener evaluación clínica, vigilancia de eficacia, eventos adversos e interacciones.";
    }

    function mostrarHTML(html) {
      const resultado = document.getElementById("resultado");
      resultado.style.display = "block";
      resultado.innerHTML = html;
    }
  </script>
</body>
</html>
