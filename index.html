<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador Farmacogenético de Opioides</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background:#f7fafa; margin:0; padding:24px; color:#111; }
    .container { max-width:1100px; margin:auto; background:#fff; border:3px solid #111; border-radius:10px; padding:24px; }
    .title { background:#7fcbd3; text-align:center; font-weight:bold; font-size:24px; padding:12px; border-radius:8px; margin-bottom:20px; }
    .section-title { text-align:center; font-weight:bold; font-size:20px; border-bottom:3px solid #299aaa; padding-bottom:8px; margin:24px 0 18px; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:20px; }
    .grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-bottom:20px; }
    label { font-weight:bold; display:block; margin-bottom:6px; }
    select, input, textarea { width:100%; padding:12px; border:3px solid #111; border-radius:8px; background:#fff6c7; font-size:15px; box-sizing:border-box; }
    textarea { min-height:80px; resize:vertical; }
    .upload-box { border:2px solid #d5e7e9; border-radius:8px; background:#f1f8f9; padding:18px; text-align:center; font-weight:bold; margin-bottom:20px; }
    button { display:block; margin:18px auto; padding:14px 24px; background:#7fcbd3; border:3px solid #111; border-radius:8px; font-weight:bold; font-size:18px; cursor:pointer; }
    .result { margin-top:24px; padding:18px; border:2px solid #299aaa; border-radius:8px; background:#f3fbfc; display:none; line-height:1.5; }
    .warning { background:#fff3cd; border:2px solid #d39e00; padding:12px; border-radius:8px; margin-top:12px; }
    .ok { background:#e8f8ef; border:2px solid #28a745; padding:12px; border-radius:8px; margin-top:12px; }
    .bad { background:#fdecea; border:2px solid #dc3545; padding:12px; border-radius:8px; margin-top:12px; }
    .small { font-size:13px; color:#444; }
    @media (max-width:800px){ .grid, .grid-2{grid-template-columns:1fr;} .title{font-size:20px;} }
  </style>
</head>

<body>
  <div class="container">
    <div class="title">BUSCADOR FARMACOGENÉTICO DE OPIOIDES</div>

    <div class="section-title">INFORMACIÓN CLÍNICA DEL PACIENTE</div>

    <div class="grid">
      <div>
        <label for="edad">Edad</label>
        <input id="edad" type="number" placeholder="Ej. 65">
      </div>
      <div>
        <label for="peso">Peso kg</label>
        <input id="peso" type="number" placeholder="Ej. 70">
      </div>
      <div>
        <label for="sexo">Sexo</label>
        <select id="sexo">
          <option value="">Seleccione</option>
          <option>Femenino</option>
          <option>Masculino</option>
          <option>Otro / No especificado</option>
        </select>
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label for="diagnostico">Diagnóstico o indicación clínica</label>
        <textarea id="diagnostico" placeholder="Ej. dolor oncológico, dolor postoperatorio, dolor crónico..."></textarea>
      </div>
      <div>
        <label for="medicamentos">Medicamentos concomitantes</label>
        <textarea id="medicamentos" placeholder="Ej. antidepresivos, benzodiacepinas, anticonvulsivantes, inhibidores CYP..."></textarea>
      </div>
    </div>

    <div class="grid">
      <div>
        <label for="renal">Función renal</label>
        <select id="renal">
          <option value="">Seleccione</option>
          <option>Normal / TFG > 90</option>
          <option>Leve / TFG 60-89</option>
          <option>Moderada / TFG 30-59</option>
          <option>Severa / TFG 15-29</option>
          <option>Falla renal / TFG < 15</option>
          <option>Desconocida</option>
        </select>
      </div>
      <div>
        <label for="hepatica">Función hepática</label>
        <select id="hepatica">
          <option value="">Seleccione</option>
          <option>Normal</option>
          <option>Alteración leve</option>
          <option>Alteración moderada</option>
          <option>Alteración severa</option>
          <option>Desconocida</option>
        </select>
      </div>
      <div>
        <label for="dolor">Tipo de dolor</label>
        <select id="dolor">
          <option value="">Seleccione</option>
          <option>Agudo</option>
          <option>Crónico</option>
          <option>Oncológico</option>
          <option>Postoperatorio</option>
          <option>Paliativo</option>
        </select>
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label for="actual">Opioide actual</label>
        <select id="actual">
          <option value="">Seleccione</option>
          <option>Ninguno</option>
          <option>Codeína</option>
          <option>Tramadol</option>
          <option>Hidrocodona</option>
          <option>Oxicodona</option>
          <option>Morfina</option>
          <option>Hidromorfona</option>
          <option>Fentanilo</option>
          <option>Metadona</option>
          <option>Buprenorfina</option>
          <option>Tapentadol</option>
        </select>
      </div>
      <div>
        <label for="adversos">Eventos adversos previos a opioides</label>
        <textarea id="adversos" placeholder="Ej. náuseas, sedación, depresión respiratoria, falta de analgesia..."></textarea>
      </div>
    </div>

    <div class="section-title">CARGA DE REPORTE FARMACOGENÉTICO</div>

    <div class="upload-box">
      <p>Suba un reporte farmacogenético en PDF. El sistema intentará extraer genes y fenotipos relevantes para opioides.</p>
      <input type="file" id="pdf" accept=".pdf">
      <button onclick="leerPDF()">Leer PDF farmacogenético</button>
    </div>

    <div class="section-title">SELECCIÓN MANUAL FARMACOGENÉTICA</div>

    <div class="grid">
      <div>
        <label for="farmaco">Opioide a evaluar</label>
        <select id="farmaco">
          <option value="">Seleccione</option>
          <option>Codeína</option>
          <option>Tramadol</option>
          <option>Hidrocodona</option>
          <option>Oxicodona</option>
          <option>Morfina</option>
          <option>Hidromorfona</option>
          <option>Fentanilo</option>
          <option>Metadona</option>
          <option>Buprenorfina</option>
          <option>Tapentadol</option>
        </select>
      </div>

      <div>
        <label for="gen">Gen</label>
        <select id="gen">
          <option value="">Seleccione</option>
          <option>CYP2D6</option>
          <option>CYP2B6</option>
          <option>OPRM1</option>
          <option>CYP3A4</option>
          <option>CYP3A5</option>
          <option>COMT</option>
          <option>ABCB1</option>
        </select>
      </div>

      <div>
        <label for="fenotipo">Fenotipo</label>
        <select id="fenotipo">
          <option value="">Seleccione</option>
          <option>Poor Metabolizer</option>
          <option>Intermediate Metabolizer</option>
          <option>Normal Metabolizer</option>
          <option>Rapid Metabolizer</option>
          <option>Ultrarapid Metabolizer</option>
          <option>Unknown</option>
        </select>
      </div>
    </div>

    <button onclick="consultar()">Consultar interpretación</button>

    <div id="resultado" class="result"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let textoPDF = "";

    async function leerPDF() {
      const archivo = document.getElementById("pdf").files[0];

      if (!archivo) {
        mostrar("Debe seleccionar un archivo PDF.", "warning");
        return;
      }

      const buffer = await archivo.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

      textoPDF = "";

      for (let i = 1; i <= pdf.numPages; i++) {
        const pagina = await pdf.getPage(i);
        const contenido = await pagina.getTextContent();
        const textoPagina = contenido.items.map(item => item.str).join(" ");
        textoPDF += " " + textoPagina;
      }

      analizarTextoPDF(textoPDF);
    }

    function analizarTextoPDF(texto) {
      const t = texto.toUpperCase();

      const genes = ["CYP2D6", "CYP2B6", "OPRM1", "CYP3A4", "CYP3A5", "COMT", "ABCB1"];
      const encontrados = genes.filter(g => t.includes(g));

      let fenotipoCYP2D6 = "Unknown";

      if (t.includes("CYP2D6") && t.includes("POOR METABOLIZER")) fenotipoCYP2D6 = "Poor Metabolizer";
      if (t.includes("CYP2D6") && t.includes("INTERMEDIATE METABOLIZER")) fenotipoCYP2D6 = "Intermediate Metabolizer";
      if (t.includes("CYP2D6") && t.includes("NORMAL METABOLIZER")) fenotipoCYP2D6 = "Normal Metabolizer";
      if (t.includes("CYP2D6") && t.includes("RAPID METABOLIZER")) fenotipoCYP2D6 = "Rapid Metabolizer";
      if (t.includes("CYP2D6") && t.includes("ULTRARAPID METABOLIZER")) fenotipoCYP2D6 = "Ultrarapid Metabolizer";

      let html = resumenPaciente();
      html += "<strong>Lectura preliminar del PDF</strong><br><br>";

      if (encontrados.length === 0) {
        html += "<div class='bad'>No se detectaron genes farmacogenéticos relevantes para opioides. Verifique que el PDF sea un reporte PGx.</div>";
      } else {
        html += "<div class='ok'><strong>Genes detectados:</strong> " + encontrados.join(", ") + "</div>";
      }

      html += "<div class='ok'><strong>Fenotipo CYP2D6 estimado:</strong> " + fenotipoCYP2D6 + "</div>";

      html += interpretar("Codeína", "CYP2D6", fenotipoCYP2D6);
      html += interpretar("Tramadol", "CYP2D6", fenotipoCYP2D6);
      html += interpretar("Hidrocodona", "CYP2D6", fenotipoCYP2D6);
      html += interpretar("Oxicodona", "CYP2D6", fenotipoCYP2D6);
      html += interpretar("Morfina", "CYP2D6", fenotipoCYP2D6);
      html += interpretar("Hidromorfona", "CYP2D6", fenotipoCYP2D6);

      html += alertasClinicas();
      html += avisoFinal();

      mostrarHTML(html);
    }

    function consultar() {
      const farmaco = document.getElementById("farmaco").value;
      const gen = document.getElementById("gen").value;
      const fenotipo = document.getElementById("fenotipo").value;

      if (!farmaco || !gen || !fenotipo) {
        mostrar("Seleccione opioide, gen y fenotipo para generar una interpretación preliminar.", "warning");
        return;
      }

      let html = resumenPaciente();
      html += interpretar(farmaco, gen, fenotipo);
      html += alertasClinicas();
      html += avisoFinal();

      mostrarHTML(html);
    }

    function resumenPaciente() {
      const edad = document.getElementById("edad").value || "No registrada";
      const peso = document.getElementById("peso").value || "No registrado";
      const sexo = document.getElementById("sexo").value || "No registrado";
      const diagnostico = document.getElementById("diagnostico").value || "No registrado";
      const renal = document.getElementById("renal").value || "No registrada";
      const hepatica = document.getElementById("hepatica").value || "No registrada";
      const dolor = document.getElementById("dolor").value || "No registrado";
      const actual = document.getElementById("actual").value || "No registrado";

      return `
        <div class="ok">
          <strong>Resumen clínico del paciente</strong><br>
          <strong>Edad:</strong> ${edad}<br>
          <strong>Peso:</strong> ${peso} kg<br>
          <strong>Sexo:</strong> ${sexo}<br>
          <strong>Diagnóstico:</strong> ${diagnostico}<br>
          <strong>Tipo de dolor:</strong> ${dolor}<br>
          <strong>Función renal:</strong> ${renal}<br>
          <strong>Función hepática:</strong> ${hepatica}<br>
          <strong>Opioide actual:</strong> ${actual}
        </div>
      `;
    }

    function alertasClinicas() {
      const edad = Number(document.getElementById("edad").value);
      const renal = document.getElementById("renal").value;
      const hepatica = document.getElementById("hepatica").value;
      const medicamentos = document.getElementById("medicamentos").value;
      const adversos = document.getElementById("adversos").value;

      let html = "";

      if (edad && edad > 65) {
        html += "<div class='warning'><strong>Alerta clínica:</strong> paciente mayor de 65 años. Considerar mayor riesgo de sedación, caídas y eventos adversos con opioides.</div>";
      }

      if (renal.includes("Moderada") || renal.includes("Severa") || renal.includes("Falla")) {
        html += "<div class='warning'><strong>Alerta renal:</strong> alteración de función renal. Considerar ajuste, vigilancia o elección de opioide según contexto clínico.</div>";
      }

      if (hepatica.includes("moderada") || hepatica.includes("severa") || hepatica.includes("Alteración moderada") || hepatica.includes("Alteración severa")) {
        html += "<div class='warning'><strong>Alerta hepática:</strong> alteración hepática. Considerar metabolismo del opioide y vigilancia clínica.</div>";
      }

      if (medicamentos.trim() !== "") {
        html += "<div class='warning'><strong>Medicamentos concomitantes:</strong> revisar posibles interacciones, especialmente depresores del sistema nervioso central e inhibidores/inductores de CYP.</div>";
      }

      if (adversos.trim() !== "") {
        html += "<div class='warning'><strong>Antecedentes de eventos adversos:</strong> considerar historia previa antes de seleccionar o ajustar opioide.</div>";
      }

      return html;
    }

    function interpretar(farmaco, gen, fenotipo) {
      let recomendacion = "";
      let clase = "warning";

      if (gen === "CYP2D6" && (farmaco === "Codeína" || farmaco === "Tramadol")) {
        if (fenotipo === "Poor Metabolizer") {
          recomendacion = "Evitar uso. Riesgo de falta de eficacia por baja conversión a metabolito activo. Considerar alternativas no dependientes de CYP2D6 como morfina o hidromorfona.";
          clase = "bad";
        } else if (fenotipo === "Intermediate Metabolizer") {
          recomendacion = "Usar con precaución. Puede existir respuesta analgésica reducida. Considerar alternativa o vigilancia clínica estrecha.";
          clase = "warning";
        } else if (fenotipo === "Ultrarapid Metabolizer") {
          recomendacion = "Evitar uso. Riesgo aumentado de toxicidad por conversión rápida a metabolito activo.";
          clase = "bad";
        } else {
          recomendacion = "Uso posible con precauciones estándar, considerando contexto clínico.";
          clase = "ok";
        }
      }

      else if (gen === "CYP2D6" && (farmaco === "Hidrocodona" || farmaco === "Oxicodona")) {
        recomendacion = "CYP2D6 puede influir parcialmente en la respuesta. Interpretar con cautela y considerar factores clínicos adicionales.";
        clase = "warning";
      }

      else if (farmaco === "Morfina" || farmaco === "Hidromorfona") {
        recomendacion = "Menor dependencia de CYP2D6. Puede considerarse como alternativa cuando existe alteración relevante de CYP2D6, según criterio clínico.";
        clase = "ok";
      }

      else if (farmaco === "Metadona" && gen === "CYP2B6") {
        recomendacion = "CYP2B6 puede afectar exposición a metadona. Se recomienda precaución, vigilancia de eventos adversos y ajuste clínico individualizado.";
        clase = "warning";
      }

      else if (farmaco === "Fentanilo" && (gen === "CYP3A4" || gen === "CYP3A5")) {
        recomendacion = "El metabolismo puede estar influenciado por CYP3A. Considerar interacciones medicamentosas y contexto clínico.";
        clase = "warning";
      }

      else if (gen === "OPRM1") {
        recomendacion = "OPRM1 puede relacionarse con variabilidad en respuesta analgésica. La evidencia clínica puede ser informativa y debe integrarse con otros factores.";
        clase = "warning";
      }

      else {
        recomendacion = "No hay una regla local definida todavía para esta combinación. Requiere consulta posterior con PharmGKB, CPIC o ClinPGx.";
        clase = "warning";
      }

      return `
        <div class="${clase}">
          <strong>${farmaco}</strong><br>
          <strong>Gen:</strong> ${gen}<br>
          <strong>Fenotipo:</strong> ${fenotipo}<br>
          <strong>Interpretación:</strong> ${recomendacion}
        </div>
      `;
    }

    function avisoFinal() {
      return `
        <p class="small">
          <strong>Nota:</strong> Esta es una interpretación preliminar para prototipo. No reemplaza el criterio médico, la revisión farmacológica integral ni las guías clínicas completas CPIC, PharmGKB, DPWG o ClinPGx. Debe ser revisada por un profesional de salud.
        </p>
      `;
    }

    function mostrar(mensaje, tipo) {
      const resultado = document.getElementById("resultado");
      resultado.style.display = "block";
      resultado.innerHTML = `<div class="${tipo}">${mensaje}</div>`;
    }

    function mostrarHTML(html) {
      const resultado = document.getElementById("resultado");
      resultado.style.display = "block";
      resultado.innerHTML = html;
    }
  </script>
</body>
</html>
