<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Buscador Farmacogenético de Opioides</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --navy: #082a5e;
      --navy2: #0b3d7a;
      --teal: #008c95;
      --teal2: #00a7a7;
      --card: rgba(255, 255, 255, 0.94);
      --border: #d7e4ea;
      --text: #10233f;
      --muted: #6b7a90;
    }

    body {
      font-family: Arial, sans-serif;

      background-image:
        linear-gradient(
          rgba(244, 249, 251, 0.86),
          rgba(244, 249, 251, 0.86)
        ),
        url("opiodes2.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      margin: 0;
      padding: 0;
      color: var(--text);
    }

    .container {
      max-width: 1120px;
      margin: 28px auto;
      padding: 0 22px 30px;
    }

    .title {
      background: linear-gradient(
        135deg,
        var(--navy),
        var(--navy2)
      );

      color: white;
      text-align: left;
      font-weight: bold;
      font-size: 28px;

      padding: 26px 34px;
      border-radius: 0 0 22px 22px;
      margin: 0 0 26px;

      box-shadow: 0 12px 28px rgba(8, 42, 94, 0.25);
      letter-spacing: 0.3px;
    }

    .title::after {
      content: "Apoyo a la decisión clínica personalizada";
      display: block;

      font-size: 16px;
      font-weight: normal;

      margin-top: 8px;
      color: #dcecff;
    }

    .section-title {
      text-align: left;
      font-weight: bold;
      font-size: 21px;
      color: var(--teal);
      margin: 28px 0 18px;
    }

    .section-title::before {
      content: "●";
      color: var(--teal2);
      margin-right: 10px;
    }

    .grid,
    .grid-2 {
      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 22px;

      box-shadow: 0 8px 26px rgba(30, 70, 100, 0.10);
      backdrop-filter: blur(4px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 18px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 18px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      color: var(--navy);
      font-size: 14px;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 13px 14px;

      border: 1.5px solid #cfdbe4;
      border-radius: 10px;

      background: #ffffff;
      font-size: 15px;
      box-sizing: border-box;

      color: var(--text);
      outline: none;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0, 140, 149, 0.12);
    }

    textarea {
      min-height: 86px;
      resize: vertical;
    }

    .upload-box {
      border: 1px dashed var(--teal);
      border-radius: 18px;

      background: rgba(242, 251, 251, 0.94);

      padding: 24px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 22px;

      box-shadow: 0 8px 26px rgba(30, 70, 100, 0.10);
      backdrop-filter: blur(4px);
    }

    button {
      display: block;
      margin: 22px auto;
      padding: 14px 28px;

      background: linear-gradient(
        135deg,
        var(--teal),
        var(--navy)
      );

      color: white;
      border: none;
      border-radius: 10px;

      font-weight: bold;
      font-size: 17px;
      cursor: pointer;

      box-shadow: 0 8px 18px rgba(8, 42, 94, 0.22);

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    .result {
      margin-top: 26px;
      padding: 22px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: rgba(255, 255, 255, 0.95);

      display: none;
      line-height: 1.5;

      box-shadow: 0 8px 26px rgba(30, 70, 100, 0.10);
      backdrop-filter: blur(4px);
    }

    .report-card {
      background: #ffffff;

      border: 1px solid var(--border);
      border-radius: 16px;

      padding: 18px;
      margin: 16px 0;

      box-shadow: 0 6px 18px rgba(30, 70, 100, 0.06);
    }

    .report-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 12px;
      color: var(--navy);
    }

    .badge-green,
    .badge-yellow,
    .badge-red {
      padding: 10px 12px;
      border-radius: 10px;
      margin: 8px 0;
      font-weight: bold;
      display: block;
    }

    .badge-green {
      background: #e8f8ef;
      border: 1px solid #52b788;
      color: #0d6b3f;
    }

    .badge-yellow {
      background: #fff8df;
      border: 1px solid #e3b341;
      color: #7a5500;
    }

    .badge-red {
      background: #fdecec;
      border: 1px solid #e07171;
      color: #9b1c1c;
    }

    .clinical-annotation {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .gene-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }

    .gene-table th,
    .gene-table td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    .gene-table th {
      background: #eef7f8;
      color: var(--navy);
    }

    .small {
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 800px) {
      .grid,
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .title {
        font-size: 22px;
        padding: 22px;
      }

      .container {
        padding: 0 12px 24px;
      }

      .gene-table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="title">
      BUSCADOR FARMACOGENÉTICO DE OPIOIDES
    </div>

    <div class="section-title">
      INFORMACIÓN CLÍNICA DEL PACIENTE
    </div>

    <div class="grid">

      <div>
        <label for="edad">Edad</label>

        <input
          id="edad"
          type="number"
          min="0"
          placeholder="Ej. 65"
        >
      </div>

      <div>
        <label for="peso">Peso kg</label>

        <input
          id="peso"
          type="number"
          min="0"
          step="0.1"
          placeholder="Ej. 70"
        >
      </div>

      <div>
        <label for="sexo">Sexo</label>

        <select id="sexo">
          <option value="">Seleccione</option>
          <option value="Femenino">Femenino</option>
          <option value="Masculino">Masculino</option>

          <option value="Otro / No especificado">
            Otro / No especificado
          </option>
        </select>
      </div>

    </div>

    <div class="grid-2">

      <div>
        <label for="diagnostico">
          Diagnóstico o indicación clínica
        </label>

        <textarea
          id="diagnostico"
          placeholder="Ej. dolor oncológico, dolor postoperatorio, dolor crónico..."
        ></textarea>
      </div>

      <div>
        <label for="medicamentos">
          Medicamentos concomitantes
        </label>

        <textarea
          id="medicamentos"
          placeholder="Ej. antidepresivos, benzodiacepinas, anticonvulsivantes, inhibidores CYP..."
        ></textarea>
      </div>

    </div>

    <div class="grid">

      <div>
        <label for="renal">Función renal</label>

        <select id="renal">
          <option value="">Seleccione</option>

          <option value="Normal / TFG > 90">
            Normal / TFG &gt; 90
          </option>

          <option value="Leve / TFG 60-89">
            Leve / TFG 60-89
          </option>

          <option value="Moderada / TFG 30-59">
            Moderada / TFG 30-59
          </option>

          <option value="Severa / TFG 15-29">
            Severa / TFG 15-29
          </option>

          <option value="Falla renal / TFG < 15">
            Falla renal / TFG &lt; 15
          </option>

          <option value="Desconocida">
            Desconocida
          </option>
        </select>
      </div>

      <div>
        <label for="hepatica">
          Función hepática
        </label>

        <select id="hepatica">
          <option value="">Seleccione</option>
          <option value="Normal">Normal</option>

          <option value="Alteración leve">
            Alteración leve
          </option>

          <option value="Alteración moderada">
            Alteración moderada
          </option>

          <option value="Alteración severa">
            Alteración severa
          </option>

          <option value="Desconocida">
            Desconocida
          </option>
        </select>
      </div>

      <div>
        <label for="dolor">Tipo de dolor</label>

        <select id="dolor">
          <option value="">Seleccione</option>
          <option value="Agudo">Agudo</option>
          <option value="Crónico">Crónico</option>
          <option value="Oncológico">Oncológico</option>
          <option value="Postoperatorio">Postoperatorio</option>
          <option value="Paliativo">Paliativo</option>
        </select>
      </div>

    </div>

    <div class="grid-2">

      <div>
        <label for="actual">
          Opioide actual
        </label>

        <select id="actual">
          <option value="">Seleccione</option>
          <option value="Ninguno">Ninguno</option>
          <option value="Codeína">Codeína</option>
          <option value="Tramadol">Tramadol</option>
          <option value="Hidrocodona">Hidrocodona</option>
          <option value="Oxicodona">Oxicodona</option>
          <option value="Morfina">Morfina</option>
          <option value="Hidromorfona">Hidromorfona</option>
          <option value="Fentanilo">Fentanilo</option>
          <option value="Metadona">Metadona</option>
          <option value="Buprenorfina">Buprenorfina</option>
          <option value="Tapentadol">Tapentadol</option>
        </select>
      </div>

      <div>
        <label for="adversos">
          Eventos adversos previos a opioides
        </label>

        <textarea
          id="adversos"
          placeholder="Ej. náuseas, sedación, depresión respiratoria, falta de analgesia..."
        ></textarea>
      </div>

    </div>

    <div class="section-title">
      CARGA DE REPORTE FARMACOGENÉTICO
    </div>

    <div class="upload-box">

      <p>
        Suba un reporte farmacogenético en PDF.
        El sistema intentará detectar todos los genes
        y los fenotipos descritos en el documento.
      </p>

      <input
        type="file"
        id="pdf"
        accept=".pdf,application/pdf"
      >

      <button
        id="botonPDF"
        type="button"
        onclick="leerPDF()"
      >
        Leer PDF farmacogenético
      </button>

    </div>

    <div class="section-title">
      SELECCIÓN FARMACOGENÉTICA
    </div>

    <div class="grid">

      <div>
        <label for="farmaco">
          Opioide a evaluar
        </label>

        <select id="farmaco">
          <option value="">Seleccione</option>
          <option value="Codeína">Codeína</option>
          <option value="Tramadol">Tramadol</option>
          <option value="Hidrocodona">Hidrocodona</option>
          <option value="Oxicodona">Oxicodona</option>
          <option value="Morfina">Morfina</option>
          <option value="Hidromorfona">Hidromorfona</option>
          <option value="Fentanilo">Fentanilo</option>
          <option value="Metadona">Metadona</option>
          <option value="Buprenorfina">Buprenorfina</option>
          <option value="Tapentadol">Tapentadol</option>
        </select>
      </div>

      <div>
        <label for="gen">
          Gen
        </label>

        <select
          id="gen"
          onchange="actualizarFenotipoSegunGen()"
        >
          <option value="">Seleccione</option>
          <option value="CYP2D6">CYP2D6</option>
          <option value="CYP2B6">CYP2B6</option>
          <option value="OPRM1">OPRM1</option>
          <option value="CYP3A4">CYP3A4</option>
          <option value="CYP3A5">CYP3A5</option>
          <option value="COMT">COMT</option>
          <option value="ABCB1">ABCB1</option>
        </select>
      </div>

      <div>
        <label for="fenotipo">
          Fenotipo
        </label>

        <select id="fenotipo">
          <option value="">Seleccione</option>

          <option value="Metabolizador lento">
            Metabolizador lento
          </option>

          <option value="Metabolizador intermedio">
            Metabolizador intermedio
          </option>

          <option value="Metabolizador normal">
            Metabolizador normal
          </option>

          <option value="Metabolizador rápido">
            Metabolizador rápido
          </option>

          <option value="Metabolizador ultrarrápido">
            Metabolizador ultrarrápido
          </option>

          <option value="Actividad reducida">
            Actividad reducida
          </option>

          <option value="Actividad normal">
            Actividad normal
          </option>

          <option value="Actividad aumentada">
            Actividad aumentada
          </option>

          <option value="Desconocido">
            Desconocido
          </option>
        </select>
      </div>

    </div>

    <button
      id="botonConsultar"
      type="button"
      onclick="consultar()"
    >
      Generar reporte clínico preliminar
    </button>

    <div
      id="resultado"
      class="result"
      aria-live="polite"
    ></div>

  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let genesDetectadosPDF = [];

    let resultadosGenesPDF = {};

    const genesFarmacogeneticos = [
      "ABCB1",
      "ABCC2",
      "ABCC3",
      "ABCG2",
      "ANKK1",
      "BDNF",
      "CES1",
      "COMT",
      "CYP1A2",
      "CYP2B6",
      "CYP2C8",
      "CYP2C9",
      "CYP2C19",
      "CYP2D6",
      "CYP2E1",
      "CYP3A4",
      "CYP3A5",
      "CYP3A7",
      "DRD2",
      "FAAH",
      "GABRA2",
      "GABRB2",
      "GABRG2",
      "GRIK1",
      "GRIN1",
      "GRIN2A",
      "GRIN2B",
      "HTR1A",
      "HTR2A",
      "HTR2C",
      "KCNJ6",
      "MC1R",
      "MTHFR",
      "NR3C1",
      "OPRD1",
      "OPRK1",
      "OPRL1",
      "OPRM1",
      "P2RX7",
      "PDYN",
      "POMC",
      "SCN9A",
      "SLC6A4",
      "SULT1A1",
      "UGT1A1",
      "UGT1A3",
      "UGT1A4",
      "UGT1A6",
      "UGT1A9",
      "UGT2B4",
      "UGT2B7",
      "UGT2B15",
      "UGT2B17"
    ];

    async function leerPDF() {
      const archivo =
        document.getElementById("pdf").files[0];

      const botonPDF =
        document.getElementById("botonPDF");

      if (!archivo) {
        mostrarHTML(`
          <div class="badge-yellow">
            Debe seleccionar un archivo PDF.
          </div>
        `);

        return;
      }

      const esPDF =
        archivo.type === "application/pdf" ||
        archivo.name.toLowerCase().endsWith(".pdf");

      if (!esPDF) {
        mostrarHTML(`
          <div class="badge-yellow">
            El archivo seleccionado debe estar en formato PDF.
          </div>
        `);

        return;
      }

      botonPDF.disabled = true;
      botonPDF.textContent = "Leyendo PDF...";

      mostrarHTML(`
        <div class="report-card">
          <div class="report-title">
            Procesando reporte farmacogenético
          </div>

          <p>
            El sistema está leyendo todas las páginas
            y buscando genes farmacogenéticos.
          </p>
        </div>
      `);

      try {
        const buffer =
          await archivo.arrayBuffer();

        const pdf =
          await pdfjsLib
            .getDocument({ data: buffer })
            .promise;

        let textoPDF = "";

        for (
          let numeroPagina = 1;
          numeroPagina <= pdf.numPages;
          numeroPagina++
        ) {
          const pagina =
            await pdf.getPage(numeroPagina);

          const contenido =
            await pagina.getTextContent();

          const textoPagina =
            contenido.items
              .map(item => item.str)
              .join(" ");

          textoPDF += ` ${textoPagina}`;
        }

        if (!textoPDF.trim()) {
          mostrarHTML(`
            <div class="badge-yellow">
              No fue posible extraer texto del PDF.
              El documento podría estar escaneado como imagen.
            </div>

            <p class="small">
              Esta versión usa extracción directa de texto
              y todavía no incluye reconocimiento OCR.
            </p>
          `);

          return;
        }

        analizarTextoPDF(textoPDF);

      } catch (error) {
        mostrarHTML(`
          <div class="badge-red">
            No fue posible procesar el archivo PDF.
          </div>

          <p class="small">
            ${escaparHTML(error.message)}
          </p>
        `);

      } finally {
        botonPDF.disabled = false;
        botonPDF.textContent =
          "Leer PDF farmacogenético";
      }
    }

    function analizarTextoPDF(textoOriginal) {
      const textoNormalizado =
        normalizarTexto(textoOriginal);

      genesDetectadosPDF =
        detectarGenes(textoNormalizado);

      resultadosGenesPDF = {};

      genesDetectadosPDF.forEach(gen => {
        resultadosGenesPDF[gen] =
          detectarResultadoPorGen(
            textoNormalizado,
            gen
          );
      });

      actualizarSelectorGenes(
        genesDetectadosPDF
      );

      const filas =
        genesDetectadosPDF
          .map(gen => {
            const resultado =
              resultadosGenesPDF[gen] ||
              "Desconocido";

            return `
              <tr>
                <td>
                  <strong>
                    ${escaparHTML(gen)}
                  </strong>
                </td>

                <td>
                  ${escaparHTML(resultado)}
                </td>
              </tr>
            `;
          })
          .join("");

      const tabla =
        genesDetectadosPDF.length
          ? `
              <table class="gene-table">
                <thead>
                  <tr>
                    <th>Gen detectado</th>
                    <th>Fenotipo o resultado aproximado</th>
                  </tr>
                </thead>

                <tbody>
                  ${filas}
                </tbody>
              </table>
            `
          : `
              <span class="badge-yellow">
                No se identificaron genes de la lista
                farmacogenética en el texto extraído.
              </span>
            `;

      mostrarHTML(`
        <div class="report-card">
          <div class="report-title">
            Reporte farmacogenético procesado
          </div>

          <span class="badge-green">
            El documento fue leído correctamente.
          </span>

          <strong>
            Genes detectados:
          </strong>

          ${genesDetectadosPDF.length}

          ${tabla}

          <p class="small">
            La detección es automática y debe verificarse
            con el reporte original. Algunos laboratorios
            presentan genotipos, alelos, diplotipos o niveles
            de actividad sin usar directamente la palabra
            “fenotipo”.
          </p>
        </div>

        <div class="report-card">
          <div class="report-title">
            Siguiente paso
          </div>

          <span class="badge-yellow">
            Seleccione el opioide que desea evaluar.
            Después seleccione uno de los genes detectados
            y pulse “Generar reporte clínico preliminar”.
          </span>
        </div>
      `);
    }

    function detectarGenes(textoNormalizado) {
      const encontrados =
        genesFarmacogeneticos.filter(gen => {
          const expresion =
            new RegExp(
              `(^|[^A-Z0-9])${escaparRegex(gen)}([^A-Z0-9]|$)`,
              "i"
            );

          return expresion.test(
            textoNormalizado
          );
        });

      return [...new Set(encontrados)]
        .sort((a, b) =>
          a.localeCompare(b)
        );
    }

    function detectarResultadoPorGen(
      textoNormalizado,
      gen
    ) {
      const posiciones = [];

      let inicioBusqueda = 0;

      while (inicioBusqueda < textoNormalizado.length) {
        const posicion =
          textoNormalizado.indexOf(
            gen,
            inicioBusqueda
          );

        if (posicion === -1) {
          break;
        }

        posiciones.push(posicion);

        inicioBusqueda =
          posicion + gen.length;
      }

      if (!posiciones.length) {
        return "Desconocido";
      }

      const ventanas =
        posiciones.map(posicion => {
          const inicio =
            Math.max(0, posicion - 350);

          const final =
            Math.min(
              textoNormalizado.length,
              posicion + gen.length + 500
            );

          return textoNormalizado.slice(
            inicio,
            final
          );
        });

      for (const ventana of ventanas) {
        const resultado =
          detectarFenotipoEnTexto(
            ventana
          );

        if (resultado !== "Desconocido") {
          return resultado;
        }
      }

      const resultadoGlobal =
        detectarFenotipoEnTexto(
          textoNormalizado
        );

      return resultadoGlobal;
    }

    function detectarFenotipoEnTexto(texto) {
      const reglas = [
        {
          expresiones: [
            "ULTRARAPID METABOLIZER",
            "ULTRA RAPID METABOLIZER",
            "METABOLIZADOR ULTRARRAPIDO",
            "METABOLIZADOR ULTRA RAPIDO",
            "ULTRARAPID"
          ],
          valor: "Metabolizador ultrarrápido"
        },
        {
          expresiones: [
            "POOR METABOLIZER",
            "METABOLIZADOR LENTO",
            "POOR METABOLISER"
          ],
          valor: "Metabolizador lento"
        },
        {
          expresiones: [
            "INTERMEDIATE METABOLIZER",
            "INTERMEDIATE METABOLISER",
            "METABOLIZADOR INTERMEDIO"
          ],
          valor: "Metabolizador intermedio"
        },
        {
          expresiones: [
            "NORMAL METABOLIZER",
            "NORMAL METABOLISER",
            "EXTENSIVE METABOLIZER",
            "METABOLIZADOR NORMAL"
          ],
          valor: "Metabolizador normal"
        },
        {
          expresiones: [
            "RAPID METABOLIZER",
            "RAPID METABOLISER",
            "METABOLIZADOR RAPIDO"
          ],
          valor: "Metabolizador rápido"
        },
        {
          expresiones: [
            "INCREASED ACTIVITY",
            "INCREASED FUNCTION",
            "ACTIVIDAD AUMENTADA",
            "FUNCION AUMENTADA"
          ],
          valor: "Actividad aumentada"
        },
        {
          expresiones: [
            "DECREASED ACTIVITY",
            "DECREASED FUNCTION",
            "REDUCED ACTIVITY",
            "REDUCED FUNCTION",
            "ACTIVIDAD REDUCIDA",
            "FUNCION REDUCIDA"
          ],
          valor: "Actividad reducida"
        },
        {
          expresiones: [
            "NORMAL ACTIVITY",
            "NORMAL FUNCTION",
            "ACTIVIDAD NORMAL",
            "FUNCION NORMAL"
          ],
          valor: "Actividad normal"
        }
      ];

      for (const regla of reglas) {
        const encontrado =
          regla.expresiones.some(
            expresion =>
              texto.includes(expresion)
          );

        if (encontrado) {
          return regla.valor;
        }
      }

      return "Desconocido";
    }

    function actualizarSelectorGenes(genes) {
      const selector =
        document.getElementById("gen");

      selector.innerHTML = `
        <option value="">
          Seleccione
        </option>
      `;

      if (!genes.length) {
        agregarGenesBaseAlSelector();
        return;
      }

      genes.forEach(gen => {
        const opcion =
          document.createElement("option");

        opcion.value = gen;
        opcion.textContent = gen;

        selector.appendChild(opcion);
      });

      if (genes.length === 1) {
        selector.value = genes[0];
        actualizarFenotipoSegunGen();
      }
    }

    function agregarGenesBaseAlSelector() {
      const genesBase = [
        "CYP2D6",
        "CYP2B6",
        "OPRM1",
        "CYP3A4",
        "CYP3A5",
        "COMT",
        "ABCB1"
      ];

      const selector =
        document.getElementById("gen");

      genesBase.forEach(gen => {
        const opcion =
          document.createElement("option");

        opcion.value = gen;
        opcion.textContent = gen;

        selector.appendChild(opcion);
      });
    }

    function actualizarFenotipoSegunGen() {
      const gen =
        document.getElementById("gen").value;

      const selectorFenotipo =
        document.getElementById("fenotipo");

      if (
        gen &&
        resultadosGenesPDF[gen]
      ) {
        const resultado =
          resultadosGenesPDF[gen];

        const existeOpcion =
          [...selectorFenotipo.options]
            .some(
              opcion =>
                opcion.value === resultado
            );

        if (!existeOpcion) {
          const opcion =
            document.createElement("option");

          opcion.value = resultado;
          opcion.textContent = resultado;

          selectorFenotipo.appendChild(
            opcion
          );
        }

        selectorFenotipo.value =
          resultado;
      }
    }

    async function consultar() {
      const farmacoVisible =
        document.getElementById("farmaco").value;

      const gen =
        document.getElementById("gen").value;

      const fenotipo =
        document.getElementById("fenotipo").value ||
        "Desconocido";

      if (!farmacoVisible) {
        mostrarHTML(`
          <div class="badge-yellow">
            Debe seleccionar el opioide que desea evaluar.
          </div>
        `);

        return;
      }

      if (!gen) {
        mostrarHTML(`
          <div class="badge-yellow">
            Debe seleccionar el gen que desea consultar.
          </div>
        `);

        return;
      }

      await generarReporteCompleto({
        farmacoVisible,
        gen,
        fenotipo
      });
    }

    async function generarReporteCompleto({
      farmacoVisible,
      gen,
      fenotipo
    }) {
      const boton =
        document.getElementById(
          "botonConsultar"
        );

      boton.disabled = true;

      boton.textContent =
        "Consultando evidencia...";

      mostrarHTML(`
        <div class="report-card">
          <div class="report-title">
            Consultando evidencia farmacogenética
          </div>

          <p>
            Buscando información para
            <strong>
              ${escaparHTML(farmacoVisible)}
            </strong>

            y

            <strong>
              ${escaparHTML(gen)}
            </strong>

            en ClinPGx.
          </p>
        </div>
      `);

      try {
        const resultadoAPI =
          await consultarClinPGx(
            farmacoVisible,
            gen
          );

        const reporteLocal =
          generarReporteLocal(
            fenotipo,
            farmacoVisible,
            gen
          );

        const evidenciaClinPGx =
          generarTarjetaClinPGx(
            resultadoAPI,
            farmacoVisible,
            gen
          );

        mostrarHTML(
          reporteLocal +
          evidenciaClinPGx +
          generarAdvertenciaFinal()
        );

      } catch (error) {
        const reporteLocal =
          generarReporteLocal(
            fenotipo,
            farmacoVisible,
            gen
          );

        mostrarHTML(`
          ${reporteLocal}

          <div class="report-card">
            <div class="report-title">
              6. Consulta de evidencia externa
            </div>

            <span class="badge-yellow">
              El reporte preliminar fue generado,
              pero no fue posible recuperar la
              evidencia externa de ClinPGx.
            </span>

            <p class="small">
              ${escaparHTML(error.message)}
            </p>
          </div>

          ${generarAdvertenciaFinal()}
        `);

      } finally {
        boton.disabled = false;

        boton.textContent =
          "Generar reporte clínico preliminar";
      }
    }

    async function consultarClinPGx(
      farmacoVisible,
      gen
    ) {
      const farmacoAPI =
        convertirFarmacoParaAPI(
          farmacoVisible
        );

      const parametros =
        new URLSearchParams({
          drug: farmacoAPI,
          gene: gen
        });

      const respuesta =
        await fetch(
          `/api/clinpgx?${parametros.toString()}`
        );

      let resultadoAPI;

      try {
        resultadoAPI =
          await respuesta.json();
      } catch {
        throw new Error(
          "La API respondió con un formato no válido."
        );
      }

      if (!respuesta.ok) {
        throw new Error(
          resultadoAPI.error ||
          resultadoAPI.detail ||
          `Error HTTP ${respuesta.status}`
        );
      }

      return resultadoAPI;
    }

    function generarReporteLocal(
      fenotipo,
      farmacoVisible,
      gen
    ) {
      const clasificacion =
        clasificarOpioides(
          fenotipo,
          gen
        );

      return `
        <div class="report-card">
          <div class="report-title">
            1. Resumen ejecutivo
          </div>

          <span class="badge-green">
            Opioides preferidos o con menor
            dependencia de CYP2D6:
            ${escaparHTML(
              clasificacion.recomendados.join(", ")
            )}
          </span>

          <span class="badge-yellow">
            Usar con precaución:
            ${escaparHTML(
              clasificacion.precaucion.length
                ? clasificacion.precaucion.join(", ")
                : "No definido"
            )}
          </span>

          <span class="badge-red">
            Considerar evitar:
            ${escaparHTML(
              clasificacion.evitar.length
                ? clasificacion.evitar.join(", ")
                : "No definido en esta evaluación"
            )}
          </span>
        </div>

        <div class="report-card">
          <div class="report-title">
            2. Perfil farmacogenético relevante
          </div>

          <strong>Opioide evaluado:</strong>
          ${escaparHTML(farmacoVisible)}
          <br>

          <strong>Gen seleccionado:</strong>
          ${escaparHTML(gen)}
          <br>

          <strong>Fenotipo o resultado:</strong>
          ${escaparHTML(fenotipo)}
          <br><br>

          <strong>Implicación preliminar:</strong>
          ${generarImplicacionGen(gen)}
        </div>

        ${resumenPaciente()}

        <div class="report-card">
          <div class="report-title">
            4. Acción clínica sugerida
          </div>

          <p>
            ${accionClinica(
              fenotipo,
              gen,
              farmacoVisible
            )}
          </p>
        </div>

        <div class="report-card">
          <div class="report-title">
            5. Interpretación clínica preliminar
          </div>

          <p>
            La selección del opioide no debe
            fundamentarse únicamente en el resultado
            farmacogenético. Deben integrarse el tipo
            de dolor, la función renal y hepática,
            la edad, las interacciones, la respuesta
            previa y los eventos adversos.
          </p>
        </div>
      `;
    }

    function clasificarOpioides(
      fenotipo,
      gen
    ) {
      const f =
        normalizarTexto(fenotipo);

      let recomendados = [
        "Morfina",
        "Hidromorfona"
      ];

      let precaucion = [
        "Hidrocodona",
        "Oxicodona"
      ];

      let evitar = [];

      if (gen !== "CYP2D6") {
        return {
          recomendados,
          precaucion: [
            ...precaucion,
            "Codeína",
            "Tramadol"
          ],
          evitar
        };
      }

      if (
        f.includes("METABOLIZADOR LENTO") ||
        f.includes("POOR METABOLIZER")
      ) {
        evitar = [
          "Codeína",
          "Tramadol"
        ];
      } else if (
        f.includes("METABOLIZADOR ULTRARRAPIDO") ||
        f.includes("ULTRARAPID METABOLIZER")
      ) {
        evitar = [
          "Codeína",
          "Tramadol"
        ];
      } else if (
        f.includes("METABOLIZADOR INTERMEDIO") ||
        f.includes("INTERMEDIATE METABOLIZER")
      ) {
        precaucion = [
          "Codeína",
          "Tramadol",
          ...precaucion
        ];
      } else {
        precaucion = [
          ...precaucion,
          "Codeína",
          "Tramadol"
        ];
      }

      return {
        recomendados,
        precaucion:
          [...new Set(precaucion)],
        evitar:
          [...new Set(evitar)]
      };
    }

    function resumenPaciente() {
      const edad =
        document.getElementById("edad").value ||
        "No registrada";

      const peso =
        document.getElementById("peso").value ||
        "No registrado";

      const sexo =
        document.getElementById("sexo").value ||
        "No registrado";

      const diagnostico =
        document.getElementById("diagnostico").value ||
        "No registrado";

      const renal =
        document.getElementById("renal").value ||
        "No registrada";

      const hepatica =
        document.getElementById("hepatica").value ||
        "No registrada";

      const dolor =
        document.getElementById("dolor").value ||
        "No registrado";

      const actual =
        document.getElementById("actual").value ||
        "No registrado";

      const medicamentos =
        document.getElementById("medicamentos").value ||
        "No registrados";

      const adversos =
        document.getElementById("adversos").value ||
        "No registrados";

      let alertas = "";

      if (
        edad !== "No registrada" &&
        Number(edad) >= 65
      ) {
        alertas += `
          <span class="badge-yellow">
            Edad de 65 años o más:
            considerar mayor riesgo de sedación,
            caídas y eventos adversos.
          </span>
        `;
      }

      if (
        renal.includes("Moderada") ||
        renal.includes("Severa") ||
        renal.includes("Falla")
      ) {
        alertas += `
          <span class="badge-yellow">
            Función renal alterada:
            revisar selección y dosificación del opioide.
          </span>
        `;
      }

      if (
        hepatica.includes("moderada") ||
        hepatica.includes("severa")
      ) {
        alertas += `
          <span class="badge-yellow">
            Función hepática alterada:
            considerar metabolismo y vigilancia clínica.
          </span>
        `;
      }

      if (
        medicamentos !== "No registrados"
      ) {
        alertas += `
          <span class="badge-yellow">
            Revisar depresores del sistema nervioso
            central, inhibidores e inductores enzimáticos.
          </span>
        `;
      }

      if (
        adversos !== "No registrados"
      ) {
        alertas += `
          <span class="badge-yellow">
            Existen eventos adversos previos:
            revisar tolerabilidad antes de seleccionar
            el tratamiento.
          </span>
        `;
      }

      return `
        <div class="report-card">
          <div class="report-title">
            3. Factores clínicos del paciente
          </div>

          <strong>Edad:</strong>
          ${escaparHTML(edad)}
          <br>

          <strong>Peso:</strong>
          ${escaparHTML(peso)}
          ${peso !== "No registrado" ? " kg" : ""}
          <br>

          <strong>Sexo:</strong>
          ${escaparHTML(sexo)}
          <br>

          <strong>Diagnóstico:</strong>
          ${escaparHTML(diagnostico)}
          <br>

          <strong>Tipo de dolor:</strong>
          ${escaparHTML(dolor)}
          <br>

          <strong>Función renal:</strong>
          ${escaparHTML(renal)}
          <br>

          <strong>Función hepática:</strong>
          ${escaparHTML(hepatica)}
          <br>

          <strong>Opioide actual:</strong>
          ${escaparHTML(actual)}
          <br>

          <strong>Medicamentos concomitantes:</strong>
          ${escaparHTML(medicamentos)}
          <br>

          <strong>Eventos adversos previos:</strong>
          ${escaparHTML(adversos)}
          <br><br>

          ${
            alertas ||
            `
              <span class="badge-green">
                No se generaron alertas clínicas
                adicionales con los datos ingresados.
              </span>
            `
          }
        </div>
      `;
    }

    function accionClinica(
      fenotipo,
      gen,
      farmacoVisible
    ) {
      const f =
        normalizarTexto(fenotipo);

      if (gen !== "CYP2D6") {
        return `
          Para ${escaparHTML(farmacoVisible)},
          la interpretación de ${escaparHTML(gen)}
          debe contrastarse con la evidencia recuperada
          de ClinPGx y con la guía clínica correspondiente.
          Esta versión no modifica automáticamente la dosis
          para este gen.
        `;
      }

      if (
        f.includes("METABOLIZADOR LENTO") ||
        f.includes("POOR METABOLIZER")
      ) {
        return `
          Considerar evitar codeína y tramadol por
          posible reducción en la formación de metabolitos
          activos y menor eficacia analgésica.
          Evaluar una alternativa con menor dependencia
          de CYP2D6.
        `;
      }

      if (
        f.includes("METABOLIZADOR INTERMEDIO")
      ) {
        return `
          Usar codeína y tramadol con precaución por
          posible respuesta analgésica reducida.
          Valorar una alternativa si la respuesta es
          insuficiente.
        `;
      }

      if (
        f.includes("METABOLIZADOR ULTRARRAPIDO")
      ) {
        return `
          Considerar evitar codeína y tramadol por
          mayor conversión a metabolitos activos y
          posible aumento del riesgo de toxicidad.
        `;
      }

      if (
        f.includes("METABOLIZADOR NORMAL")
      ) {
        return `
          No se identifica una alerta farmacogenética
          fuerte por fenotipo CYP2D6. Mantener vigilancia
          de eficacia, sedación, eventos adversos e
          interacciones.
        `;
      }

      return `
        El fenotipo es desconocido o no fue confirmado.
        No debe generarse una recomendación definitiva
        hasta verificar el reporte farmacogenético.
      `;
    }

    function generarImplicacionGen(gen) {
      const implicaciones = {
        CYP2D6:
          "CYP2D6 puede modificar la activación de codeína y tramadol y puede influir en la respuesta a hidrocodona y oxicodona.",

        CYP2B6:
          "CYP2B6 participa en el metabolismo de algunos opioides, especialmente metadona, aunque la interpretación depende de la variante y de la evidencia clínica.",

        OPRM1:
          "OPRM1 codifica el receptor opioide μ. Algunas variantes pueden relacionarse con diferencias en analgesia o requerimientos de dosis.",

        CYP3A4:
          "CYP3A4 participa en el metabolismo de varios opioides y puede verse afectado por inhibidores e inductores farmacológicos.",

        CYP3A5:
          "CYP3A5 puede contribuir al metabolismo de algunos opioides, con relevancia dependiente del fármaco y de la variante.",

        COMT:
          "COMT participa en vías relacionadas con la percepción del dolor y la respuesta analgésica.",

        ABCB1:
          "ABCB1 codifica una proteína transportadora que puede influir en la distribución y exposición a algunos opioides.",

        UGT2B7:
          "UGT2B7 participa en la glucuronidación de varios opioides, incluida la morfina.",

        CES1:
          "CES1 participa en la biotransformación de algunos medicamentos y puede influir en determinados analgésicos."
      };

      return implicaciones[gen] ||
        "La implicación clínica del gen debe interpretarse según el medicamento, la variante y la evidencia disponible.";
    }

    function generarTarjetaClinPGx(
      resultadoAPI,
      farmacoVisible,
      gen
    ) {
      const registros =
        extraerRegistrosClinPGx(
          resultadoAPI.data
        );

      if (!registros.length) {
        return `
          <div class="report-card">
            <div class="report-title">
              6. Evidencia recuperada de ClinPGx
            </div>

            <strong>Medicamento:</strong>
            ${escaparHTML(farmacoVisible)}
            <br>

            <strong>Gen consultado:</strong>
            ${escaparHTML(gen)}
            <br><br>

            <span class="badge-yellow">
              La consulta fue completada, pero no se
              encontraron anotaciones clínicas para
              esta combinación.
            </span>
          </div>
        `;
      }

      const limite = 5;

      const anotaciones =
        registros
          .slice(0, limite)
          .map((registro, indice) => {
            const titulo =
              registro.allele ||
              registro.name ||
              registro.accessionId ||
              registro.id ||
              `Anotación ${indice + 1}`;

            const texto =
              registro.phenotype ||
              registro.annotation ||
              registro.description ||
              registro.text ||
              obtenerTextoObjeto(registro);

            return `
              <div class="clinical-annotation">
                <strong>
                  ${escaparHTML(String(titulo))}
                </strong>

                <p>
                  ${escaparHTML(String(texto))}
                </p>
              </div>
            `;
          })
          .join("");

      return `
        <div class="report-card">
          <div class="report-title">
            6. Evidencia recuperada de ClinPGx
          </div>

          <strong>Fuente:</strong>
          ${escaparHTML(
            resultadoAPI.source || "ClinPGx"
          )}
          <br>

          <strong>Medicamento:</strong>
          ${escaparHTML(farmacoVisible)}
          <br>

          <strong>Gen consultado:</strong>
          ${escaparHTML(gen)}
          <br>

          <strong>Anotaciones encontradas:</strong>
          ${registros.length}
          <br>

          ${anotaciones}

          ${
            registros.length > limite
              ? `
                  <p class="small">
                    Se muestran ${limite} de
                    ${registros.length}
                    anotaciones recuperadas.
                  </p>
                `
              : ""
          }
        </div>
      `;
    }

    function extraerRegistrosClinPGx(
      contenido
    ) {
      if (!contenido) {
        return [];
      }

      if (Array.isArray(contenido)) {
        return contenido;
      }

      if (
        Array.isArray(contenido.data)
      ) {
        return contenido.data;
      }

      if (
        contenido.data &&
        Array.isArray(contenido.data.data)
      ) {
        return contenido.data.data;
      }

      if (
        Array.isArray(contenido.results)
      ) {
        return contenido.results;
      }

      return [];
    }

    function obtenerTextoObjeto(objeto) {
      try {
        return JSON.stringify(objeto);
      } catch {
        return "Anotación recuperada sin descripción textual.";
      }
    }

    function convertirFarmacoParaAPI(
      farmaco
    ) {
      const equivalencias = {
        "Codeína": "codeine",
        "Tramadol": "tramadol",
        "Hidrocodona": "hydrocodone",
        "Oxicodona": "oxycodone",
        "Morfina": "morphine",
        "Hidromorfona": "hydromorphone",
        "Fentanilo": "fentanyl",
        "Metadona": "methadone",
        "Buprenorfina": "buprenorphine",
        "Tapentadol": "tapentadol"
      };

      return equivalencias[farmaco] ||
        farmaco;
    }

    function generarAdvertenciaFinal() {
      return `
        <div class="report-card">
          <div class="report-title">
            7. Advertencia
          </div>

          <p class="small">
            Esta herramienta es un prototipo de apoyo
            a la decisión clínica. No reemplaza el criterio
            médico, la revisión farmacológica integral,
            la historia clínica, la confirmación del resultado
            farmacogenético ni las guías clínicas completas.
            Toda recomendación debe ser evaluada y validada
            por un profesional de la salud.
          </p>
        </div>
      `;
    }

    function normalizarTexto(valor) {
      return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function escaparRegex(valor) {
      return String(valor)
        .replace(
          /[.*+?^${}()|[\]\\]/g,
          "\\$&"
        );
    }

    function escaparHTML(valor) {
      return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function mostrarHTML(html) {
      const resultado =
        document.getElementById("resultado");

      resultado.style.display = "block";
      resultado.innerHTML = html;

      resultado.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }
  </script>

</body>
