<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador Farmacogenético de Opioides</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7fafa;
      margin: 0;
      padding: 24px;
      color: #111;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #ffffff;
      border: 3px solid #111;
      border-radius: 10px;
      padding: 24px;
    }

    .title {
      background: #7fcbd3;
      text-align: center;
      font-weight: bold;
      font-size: 24px;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .section-title {
      text-align: center;
      font-weight: bold;
      font-size: 20px;
      border-bottom: 3px solid #299aaa;
      padding-bottom: 8px;
      margin: 24px 0 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border: 3px solid #111;
      border-radius: 8px;
      background: #fff6c7;
      font-weight: bold;
      font-size: 16px;
    }

    .upload-box {
      border: 2px solid #d5e7e9;
      border-radius: 8px;
      background: #f1f8f9;
      padding: 18px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .patient-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
      margin-bottom: 20px;
    }

    .radio-box {
      background: #fff6c7;
      border: 3px solid #111;
      border-radius: 8px;
      padding: 12px;
      font-weight: bold;
    }

    button {
      display: block;
      margin: 24px auto 0;
      padding: 14px 24px;
      background: #7fcbd3;
      border: 3px solid #111;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    .result {
      margin-top: 24px;
      padding: 18px;
      border: 2px solid #299aaa;
      border-radius: 8px;
      background: #f3fbfc;
      display: none;
    }

    @media (max-width: 700px) {
      .grid, .patient-grid {
        grid-template-columns: 1fr;
      }

      .title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">BUSCADOR FARMACOGENÉTICO DE OPIOIDES</div>

    <div class="section-title">PRUEBA FARMACOGENÉTICA</div>

    <div class="grid">
      <div>
        <label for="farmaco">Fármaco</label>
        <select id="farmaco">
          <option value="">Seleccione</option>
          <option>Buprenorfina</option>
          <option>Codeína</option>
          <option>Fentanilo</option>
          <option>Hidrocodona</option>
          <option>Hidromorfona</option>
          <option>Metadona</option>
          <option>Morfina</option>
          <option>Oxicodona</option>
          <option>Tapentadol</option>
          <option>Tramadol</option>
        </select>
      </div>

      <div>
        <label for="gen">Gen</label>
        <select id="gen">
          <option value="">Seleccione</option>
          <option>CYP2D6</option>
          <option>CYP2B6</option>
          <option>OPRM1</option>
          <option>Otros</option>
        </select>
      </div>

      <div>
        <label for="genotipo">Genotipo</label>
        <select id="genotipo">
          <option value="">Seleccione</option>
          <option>*1/*1</option>
          <option>*1/*2</option>
          <option>*1/*4</option>
          <option>*4/*4</option>
          <option>AA</option>
          <option>AG</option>
          <option>GG</option>
          <option>Otros</option>
        </select>
      </div>
    </div>

    <div class="upload-box">
      <p>Si tiene una foto o documento digital de los resultados de la prueba, cárguelo aquí.</p>
      <input type="file" id="pdf" accept=".pdf,.jpg,.jpeg,.png">
    </div>

    <div class="section-title">DATOS COMPLEMENTARIOS DEL PACIENTE</div>

    <div class="patient-grid">
      <div>
        <label for="renal">Función renal (TFG en ml/min)</label>
        <select id="renal">
          <option value="">Seleccione</option>
          <option>&gt; 90</option>
          <option>60 - 89</option>
          <option>30 - 59</option>
          <option>15 - 29</option>
          <option>&lt; 15</option>
        </select>
      </div>

      <div>
        <label for="edad">Edad</label>
        <select id="edad">
          <option value="">Seleccione</option>
          <option>&lt; 18 años</option>
          <option>18 - 40 años</option>
          <option>41 - 65 años</option>
          <option>&gt; 65 años</option>
        </select>
      </div>
    </div>

    <div class="patient-grid">
      <div class="radio-box">
        ¿Ha usado opioides antes?
        <label><input type="radio" name="opioide_prev" value="Sí"> Sí</label>
        <label><input type="radio" name="opioide_prev" value="No"> No</label>
      </div>

      <div>
        <label for="actual">Opioide actual</label>
        <select id="actual">
          <option value="">Seleccione</option>
          <option>Buprenorfina</option>
          <option>Codeína</option>
          <option>Fentanilo</option>
          <option>Hidrocodona</option>
          <option>Hidromorfona</option>
          <option>Metadona</option>
          <option>Morfina</option>
          <option>Oxicodona</option>
          <option>Tapentadol</option>
          <option>Tramadol</option>
        </select>
      </div>
    </div>

    <button onclick="consultar()">Consultar interpretación</button>

    <div id="resultado" class="result"></div>
  </div>

  <script>
    function consultar() {
      const farmaco = document.getElementById("farmaco").value;
      const gen = document.getElementById("gen").value;
      const genotipo = document.getElementById("genotipo").value;
      const resultado = document.getElementById("resultado");

      if (!farmaco || !gen || !genotipo) {
        resultado.style.display = "block";
        resultado.innerHTML = "<strong>Resultado:</strong><br>Seleccione fármaco, gen y genotipo para generar una interpretación preliminar.";
        return;
      }

      resultado.style.display = "block";
      resultado.innerHTML = `
        <strong>Interpretación preliminar</strong><br><br>
        <strong>Fármaco:</strong> ${farmaco}<br>
        <strong>Gen:</strong> ${gen}<br>
        <strong>Genotipo:</strong> ${genotipo}<br><br>
        Esta es una versión inicial de prueba. La interpretación clínica definitiva deberá conectarse posteriormente con bases de datos farmacogenéticas validadas, como PharmGKB/CPIC, y ser revisada por un profesional de salud.
      `;
    }
  </script>
</body>
</html>
